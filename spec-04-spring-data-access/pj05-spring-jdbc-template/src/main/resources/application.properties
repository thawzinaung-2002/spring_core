spring.datasource.url=jdbc:h2:file:./database/locationDb
spring.datasource.username=sa
spring.datasource.password=sa

#spring.sql.init.mode=always
spring.h2.console.enabled=true

app.sql.division-select=select dv.id, dv.name, count(ds.id) count \
						from DIVISION dv \
						JOIN DISTRICT ds on ds.division_id=dv.id

app.sql.division-group-by=group by dv.id, dv.name

app.sql.district-select=SELECT DT.ID, DT.NAME, DV.ID divisionId, DV.NAME divisionName, count(TSP.ID) townships \
						FROM DISTRICT DT \
						join DIVISION DV on DT.DIVISION_ID=DV.ID \
						join TOWNSHIP TSP on TSP.DISTRICT_ID=DV.ID \
						where 1=1

app.sql.district-group-by=GROUP BY DT.ID, DT.NAME, DV.ID, DV.NAME
